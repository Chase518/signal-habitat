# Outbound adapter: Python analysis service (see docs/decisions.md)
quarkus.rest-client."com.signalhabitat.adapters.out.analysis.PythonAnalysisClient".url=http://localhost:8000
quarkus.rest-client."com.signalhabitat.adapters.out.analysis.PythonAnalysisClient".scope=jakarta.inject.Singleton

# Outbound adapter: SQLite persistence (plain JDBC, no ORM -- see docs/decisions.md)
signalhabitat.sqlite.path=../data/signal-habitat.db

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173

# Frontend's analysisApi.js already expects snake_case (matches the Python
# service's own JSON shape) -- apply it globally instead of annotating every field.
quarkus.jackson.property-naming-strategy=SNAKE_CASE
